<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">WaveFilter public research architecture</title>
  <desc id="desc">Conceptual architecture showing the causal wave-state pipeline, independent challenger modules, and validation governance. Proprietary formulas and parameters are intentionally omitted.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
    <style>
      .title { font: 700 28px Arial, sans-serif; fill:#0f172a; }
      .subtitle { font: 400 15px Arial, sans-serif; fill:#475569; }
      .box { fill:#f8fafc; stroke:#94a3b8; stroke-width:1.5; rx:14; }
      .core { fill:#eef2ff; stroke:#818cf8; stroke-width:1.8; rx:14; }
      .module { fill:#f0fdf4; stroke:#86efac; stroke-width:1.5; rx:14; }
      .validation { fill:#fff7ed; stroke:#fdba74; stroke-width:1.5; rx:14; }
      .label { font: 600 17px Arial, sans-serif; fill:#0f172a; text-anchor:middle; }
      .small { font: 400 13px Arial, sans-serif; fill:#475569; text-anchor:middle; }
      .section { font: 700 16px Arial, sans-serif; fill:#334155; }
      .arrow { stroke:#64748b; stroke-width:2; fill:none; marker-end:url(#arrow); }
      .dash { stroke:#94a3b8; stroke-width:1.5; fill:none; stroke-dasharray:6 6; }
    </style>
  </defs>

  <rect x="0" y="0" width="1200" height="720" fill="#ffffff"/>
  <text x="60" y="54" class="title">WaveFilter Research Architecture</text>
  <text x="60" y="82" class="subtitle">Public conceptual view — production formulas, source code, and calibrated parameters are intentionally omitted.</text>

  <text x="60" y="128" class="section">Causal market-state pipeline</text>

  <rect x="60" y="150" width="170" height="82" class="box"/>
  <text x="145" y="182" class="label">Market Data</text>
  <text x="145" y="207" class="small">OHLCV / timestamps</text>

  <rect x="270" y="150" width="180" height="82" class="box"/>
  <text x="360" y="182" class="label">Causal Features</text>
  <text x="360" y="207" class="small">momentum + structure</text>

  <rect x="490" y="150" width="190" height="82" class="box"/>
  <text x="585" y="182" class="label">Robust Scaling</text>
  <text x="585" y="207" class="small">noise-aware normalization</text>

  <rect x="720" y="150" width="190" height="82" class="box"/>
  <text x="815" y="182" class="label">Evidence Layer</text>
  <text x="815" y="207" class="small">state-change evidence</text>

  <rect x="950" y="150" width="190" height="82" class="core"/>
  <text x="1045" y="182" class="label">Internal State</text>
  <text x="1045" y="207" class="small">conservative structure</text>

  <line x1="230" y1="191" x2="270" y2="191" class="arrow"/>
  <line x1="450" y1="191" x2="490" y2="191" class="arrow"/>
  <line x1="680" y1="191" x2="720" y2="191" class="arrow"/>
  <line x1="910" y1="191" x2="950" y2="191" class="arrow"/>

  <rect x="425" y="280" width="350" height="92" class="core"/>
  <text x="600" y="316" class="label">Visible Wave-State Representation</text>
  <text x="600" y="342" class="small">responsive display separated from structural confirmation</text>
  <path d="M1045 232 C1045 260 890 326 775 326" class="arrow"/>

  <text x="60" y="430" class="section">Independent research challengers</text>

  <rect x="60" y="452" width="240" height="92" class="module"/>
  <text x="180" y="486" class="label">Volatility Risk</text>
  <text x="180" y="512" class="small">non-directional regime warning</text>

  <rect x="330" y="452" width="240" height="92" class="module"/>
  <text x="450" y="486" class="label">Divergence Studies</text>
  <text x="450" y="512" class="small">evaluated separately from core</text>

  <rect x="600" y="452" width="240" height="92" class="module"/>
  <text x="720" y="486" class="label">Multi-Timeframe Context</text>
  <text x="720" y="512" class="small">context screening experiments</text>

  <rect x="870" y="452" width="270" height="92" class="module"/>
  <text x="1005" y="486" class="label">Other Challengers</text>
  <text x="1005" y="512" class="small">acceleration / adaptive thresholds</text>

  <line x1="600" y1="372" x2="600" y2="414" class="dash"/>
  <line x1="180" y1="414" x2="1005" y2="414" class="dash"/>
  <line x1="180" y1="414" x2="180" y2="452" class="dash"/>
  <line x1="450" y1="414" x2="450" y2="452" class="dash"/>
  <line x1="720" y1="414" x2="720" y2="452" class="dash"/>
  <line x1="1005" y1="414" x2="1005" y2="452" class="dash"/>

  <text x="60" y="604" class="section">Validation governance</text>
  <rect x="60" y="626" width="1080" height="62" class="validation"/>
  <text x="600" y="651" class="label">Champion / Challenger → Time-Ordered Development → Sealed Holdout → Parity Checks → Block Bootstrap → Cost & Delay Stress</text>
  <text x="600" y="674" class="small">Candidates are rejected when robustness or holdout gates fail, even when development results look attractive.</text>
</svg>
