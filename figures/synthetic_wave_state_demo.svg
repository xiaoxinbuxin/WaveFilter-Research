<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Synthetic wave-state demonstration</title>
  <desc id="desc">An illustrative synthetic market-price path and simplified wave-state panel with generic volatility-risk windows. This is not production output and contains no proprietary logic.</desc>
  <defs>
    <style>
      .title { font: 700 27px Arial, sans-serif; fill:#0f172a; }
      .subtitle { font: 400 14px Arial, sans-serif; fill:#64748b; }
      .axis { stroke:#cbd5e1; stroke-width:1; }
      .grid { stroke:#e2e8f0; stroke-width:1; }
      .price { fill:none; stroke:#334155; stroke-width:3; }
      .wave { fill:none; stroke:#475569; stroke-width:4; stroke-linejoin:round; }
      .threshold { stroke:#94a3b8; stroke-width:1.5; stroke-dasharray:6 6; }
      .risk { fill:#fef3c7; opacity:0.7; }
      .risk2 { fill:#fee2e2; opacity:0.7; }
      .label { font: 600 14px Arial, sans-serif; fill:#334155; }
      .small { font: 400 12px Arial, sans-serif; fill:#64748b; }
    </style>
  </defs>

  <rect x="0" y="0" width="1200" height="680" fill="#ffffff"/>
  <text x="60" y="50" class="title">Illustrative Synthetic Wave-State Example</text>
  <text x="60" y="76" class="subtitle">Synthetic data only — this figure is not generated by the production indicator and does not reveal proprietary formulas or parameters.</text>

  <!-- Price panel -->
  <text x="60" y="118" class="label">Synthetic price path</text>
  <rect x="60" y="135" width="1080" height="250" fill="#f8fafc" stroke="#e2e8f0"/>
  <line x1="60" y1="197" x2="1140" y2="197" class="grid"/>
  <line x1="60" y1="260" x2="1140" y2="260" class="grid"/>
  <line x1="60" y1="323" x2="1140" y2="323" class="grid"/>

  <path class="price" d="M60 312 L100 298 L140 274 L180 282 L220 244 L260 214 L300 223 L340 196 L380 176 L420 204 L460 231 L500 219 L540 251 L580 286 L620 304 L660 284 L700 247 L740 222 L780 198 L820 211 L860 244 L900 271 L940 254 L980 224 L1020 236 L1060 266 L1100 246 L1140 229"/>

  <!-- Highlight generic high-volatility intervals -->
  <rect x="540" y="135" width="110" height="250" class="risk"/>
  <rect x="860" y="135" width="90" height="250" class="risk2"/>
  <text x="555" y="158" class="small">volatility-risk window</text>
  <text x="873" y="158" class="small">higher-risk window</text>

  <!-- Wave panel -->
  <text x="60" y="430" class="label">Simplified visible wave-state</text>
  <rect x="60" y="448" width="1080" height="175" fill="#f8fafc" stroke="#e2e8f0"/>
  <line x1="60" y1="492" x2="1140" y2="492" class="threshold"/>
  <line x1="60" y1="535" x2="1140" y2="535" class="axis"/>
  <line x1="60" y1="578" x2="1140" y2="578" class="threshold"/>
  <text x="1070" y="487" class="small">upper pressure zone</text>
  <text x="1098" y="530" class="small">neutral</text>
  <text x="1070" y="596" class="small">lower pressure zone</text>

  <path class="wave" d="M60 558 H115 V548 H170 V520 H225 V500 H280 V485 H335 V494 H390 V505 H445 V525 H500 V546 H555 V569 H610 V580 H665 V566 H720 V542 H775 V512 H830 V497 H885 V519 H940 V555 H995 V563 H1050 V545 H1105 V520 H1140"/>

  <circle cx="610" cy="580" r="5" fill="#475569"/>
  <circle cx="830" cy="497" r="5" fill="#475569"/>
  <text x="60" y="655" class="small">Public visualization goal: communicate state transitions and research concepts without exposing implementation details.</text>
</svg>
